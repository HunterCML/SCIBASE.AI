<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Repository citation impact gate demo</title>
  <desc id="desc">A fork merge flows through attribution, license, reproducibility, and export attestation checks.</desc>
  <rect width="960" height="360" fill="#f6f7f9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="52" font-size="24" font-weight="700">Citation-safe repository merge</text>
    <text x="48" y="82" font-size="14">Fork metadata stays attached while hashes, licenses, and reproducibility are checked.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172033">
    <rect x="52" y="126" width="172" height="112" rx="8" fill="#ffffff" stroke="#9aa6b2"/>
    <text x="76" y="158" font-weight="700">Incoming fork</text>
    <text x="76" y="184">parent DOI</text>
    <text x="76" y="206">authors</text>
    <text x="76" y="228">component hashes</text>
    <path d="M226 182 H330" stroke="#4c6378" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="334" y="108" width="250" height="148" rx="8" fill="#ffffff" stroke="#9aa6b2"/>
    <text x="362" y="142" font-weight="700">Merge impact gate</text>
    <text x="362" y="170">1. fork attribution</text>
    <text x="362" y="194">2. license compatibility</text>
    <text x="362" y="218">3. reproducibility evidence</text>
    <text x="362" y="242">4. semantic version plan</text>
    <path d="M586 182 H690" stroke="#4c6378" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="694" y="126" width="214" height="112" rx="8" fill="#ffffff" stroke="#9aa6b2"/>
    <text x="724" y="158" font-weight="700">Export attestation</text>
    <text x="724" y="184">release decision</text>
    <text x="724" y="206">next version</text>
    <text x="724" y="228">impact digest</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4c6378"/>
    </marker>
  </defs>
</svg>
