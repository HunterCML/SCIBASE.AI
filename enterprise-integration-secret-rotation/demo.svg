    <text x="24" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8f1d12">api-dspace-prod</text>
    <text x="24" y="55" font-family="Arial, sans-serif" font-size="16" fill="#4c5563">Suspend and rotate immediately: expired credential, unauthorized admin scope, unjustified break-glass access.</text>
  </g>
  <g transform="translate(104 466)">
    <rect width="1024" height="72" rx="10" fill="#fff4f2" stroke="#f2b8af"/>
    <text x="24" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8f1d12">hook-eln-publication</text>
    <text x="24" y="55" font-family="Arial, sans-serif" font-size="16" fill="#4c5563">Pause delivery and rotate secret: overdue signing secret, long overlap window, weak retry controls.</text>
  </g>
  <g transform="translate(104 558)">
    <rect width="1024" height="72" rx="10" fill="#eef8f7" stroke="#99d5cf"/>
    <text x="24" y="31" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f5d56">hook-funder-report</text>
    <text x="24" y="55" font-family="Arial, sans-serif" font-size="16" fill="#4c5563">Monitor: HTTPS, HMAC-SHA256, idempotency, dead-letter queue, and verified recipient are in place.</text>
