<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Integration Secret Rotation Dashboard</title>
  <desc id="desc">Static preview of enterprise API and webhook governance metrics.</desc>
  <rect width="1280" height="720" fill="#f7f8fb"/>
  <rect x="64" y="48" width="1152" height="624" rx="18" fill="#ffffff" stroke="#c7cfdd"/>
  <text x="104" y="116" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1b2533">Enterprise Integration Secret Rotation</text>
  <text x="104" y="154" font-family="Arial, sans-serif" font-size="18" fill="#5c697a">Admin risk queue for institutional API clients and webhook destinations</text>
  <g transform="translate(104 202)">
    <rect width="238" height="118" rx="10" fill="#13293d"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="18" fill="#b8c7d9">Compliance score</text>
    <text x="24" y="90" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">50</text>
  </g>
  <g transform="translate(366 202)">
    <rect width="238" height="118" rx="10" fill="#b42318"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="18" fill="#ffe6e2">Critical findings</text>
    <text x="24" y="90" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">2</text>
  </g>
  <g transform="translate(628 202)">
    <rect width="238" height="118" rx="10" fill="#0f766e"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="18" fill="#d4fbf5">Systems watched</text>
    <text x="24" y="90" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">5</text>
  </g>
  <g transform="translate(890 202)">
    <rect width="238" height="118" rx="10" fill="#5b5f70"/>
    <text x="24" y="42" font-family="Arial, sans-serif" font-size="18" fill="#eceff5">Evidence digests</text>
    <text x="24" y="90" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">3</text>
  </g>
  <g transform="translate(104 374)">
