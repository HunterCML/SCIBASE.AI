<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Project data room consent ledger demo dashboard</title>
  <desc id="desc">Static preview showing identity verification, grant decisions, consent evidence, and audit digest status.</desc>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="64" y="54" width="1152" height="612" rx="8" fill="#ffffff" stroke="#c9d3df"/>
  <text x="104" y="116" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Project Data Room Consent Ledger</text>
  <text x="104" y="154" font-family="Arial, sans-serif" font-size="18" fill="#526071">Issue #11 slice: identity evidence, object-level access, restricted export consent, audit chain.</text>
  <g transform="translate(104 205)">
    <rect width="248" height="136" rx="8" fill="#eef8f3" stroke="#82c7a5"/>
    <text x="24" y="46" font-family="Arial, sans-serif" font-size="18" fill="#315f46">Verified identities</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#147a4b">3</text>
  </g>
  <g transform="translate(384 205)">
    <rect width="248" height="136" rx="8" fill="#edf4ff" stroke="#8eb6ef"/>
    <text x="24" y="46" font-family="Arial, sans-serif" font-size="18" fill="#315174">Approved grants</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#2463ad">3</text>
  </g>
  <g transform="translate(664 205)">
    <rect width="248" height="136" rx="8" fill="#fff7ed" stroke="#f3bb73"/>
    <text x="24" y="46" font-family="Arial, sans-serif" font-size="18" fill="#7c4a16">Held grants</text>
    <text x="24" y="96" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#b45309">0</text>
  </g>
  <g transform="translate(944 205)">
    <rect width="208" height="136" rx="8" fill="#f4f1ff" stroke="#b6a6eb"/>
    <text x="24" y="46" font-family="Arial, sans-serif" font-size="18" fill="#4f3f8a">Audit root</text>
    <text x="24" y="92" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#5b45b7">sha256</text>
  </g>
  <g transform="translate(104 392)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">Access decisions</text>
    <text x="0" y="42" font-family="Consolas, monospace" font-size="18" fill="#1f2937">grant-pi-admin              approve  admin      read/comment/edit/share</text>
    <text x="0" y="78" font-family="Consolas, monospace" font-size="18" fill="#1f2937">grant-biostat-data-room     approve  admin      restricted download with IRB/DUA</text>
    <text x="0" y="114" font-family="Consolas, monospace" font-size="18" fill="#1f2937">grant-anonymous-review      approve  reviewer   pseudonym and identity escrow</text>
  </g>
  <g transform="translate(104 560)">
    <rect width="1048" height="56" rx="8" fill="#f8fafc" stroke="#d8e0ea"/>
    <text x="22" y="36" font-family="Arial, sans-serif" font-size="18" fill="#344054">Export packet includes approved grant digests, held grant IDs, and final audit root for institutional review.</text>
  </g>
