<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Model card weight lineage gate demo</title>
  <desc id="desc">A model weight package moves through card, data, code, environment, rerun, and metadata checks before release.</desc>
  <rect width="1280" height="720" fill="#0f172a"/>
  <text x="70" y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="46" font-weight="700">Model Card Weight Lineage Gate</text>
  <text x="72" y="140" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24">Release trained weights only when provenance, license, and rerun evidence are complete.</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="70" y="215" width="180" height="92" rx="10" fill="#1d4ed8"/>
    <text x="100" y="268" fill="#eff6ff">Weights</text>
    <rect x="285" y="215" width="180" height="92" rx="10" fill="#047857"/>
    <text x="318" y="268" fill="#ecfdf5">Model Card</text>
    <rect x="500" y="215" width="180" height="92" rx="10" fill="#7c3aed"/>
    <text x="535" y="268" fill="#f5f3ff">Data Lineage</text>
    <rect x="715" y="215" width="180" height="92" rx="10" fill="#b45309"/>
    <text x="752" y="268" fill="#fffbeb">Environment</text>
    <rect x="930" y="215" width="180" height="92" rx="10" fill="#be123c"/>
    <text x="982" y="268" fill="#fff1f2">Rerun</text>
  </g>
  <g stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M250 261 H285"/>
    <path d="M465 261 H500"/>
    <path d="M680 261 H715"/>
    <path d="M895 261 H930"/>
  </g>
  <rect x="220" y="405" width="840" height="125" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="260" y="455" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Decision Packet</text>
  <text x="260" y="498" fill="#d1fae5" font-family="Arial, sans-serif" font-size="24">ready, review, or hold with reviewer actions and audit digest</text>
  <text x="260" y="540" fill="#fde68a" font-family="Arial, sans-serif" font-size="22">DataCite and schema.org metadata generated for DOI, API, and archive workflows</text>
</svg>
