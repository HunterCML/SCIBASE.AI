<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Repository DOI tombstone gate demo</title>
  <desc id="desc">A repository version transition checks snapshots, DOI records, redirects, citations, forks, and reproducibility evidence before release.</desc>
  <rect width="1280" height="720" fill="#111827"/>
  <text x="70" y="95" fill="#f8fafc" font-family="Arial, sans-serif" font-size="46" font-weight="700">Repository DOI Tombstone Gate</text>
  <text x="72" y="140" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24">Preserve citation continuity when a repository version is withdrawn, corrected, or superseded.</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="65" y="215" width="170" height="90" rx="10" fill="#1d4ed8"/>
    <text x="103" y="267" fill="#eff6ff">Snapshot</text>
    <rect x="275" y="215" width="170" height="90" rx="10" fill="#0369a1"/>
    <text x="324" y="267" fill="#ecfeff">DOI</text>
    <rect x="485" y="215" width="170" height="90" rx="10" fill="#047857"/>
    <text x="520" y="267" fill="#ecfdf5">Redirects</text>
    <rect x="695" y="215" width="170" height="90" rx="10" fill="#7c3aed"/>
    <text x="727" y="267" fill="#f5f3ff">Provenance</text>
    <rect x="905" y="215" width="205" height="90" rx="10" fill="#b45309"/>
    <text x="948" y="267" fill="#fffbeb">Rerun status</text>
  </g>
  <g stroke="#94a3b8" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M235 260 H275"/>
    <path d="M445 260 H485"/>
    <path d="M655 260 H695"/>
    <path d="M865 260 H905"/>
  </g>
  <rect x="220" y="400" width="840" height="130" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <text x="260" y="452" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Transition Decision</text>
  <text x="260" y="496" fill="#d1fae5" font-family="Arial, sans-serif" font-size="24">ready, review, or hold with reviewer actions and audit digest</text>
  <text x="260" y="538" fill="#fde68a" font-family="Arial, sans-serif" font-size="22">DataCite and schema.org packets preserve DOI, citation, API, and export behavior</text>
</svg>
