<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Negative results opportunity radar demo</title>
  <desc id="desc">An AI assistant converts negative results and limitations into ranked research opportunities.</desc>
  <rect width="960" height="360" fill="#f7f8fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="52" font-size="24" font-weight="700">Negative results opportunity radar</text>
    <text x="48" y="82" font-size="14">Buried limitations become assistant-ready research gap recommendations.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172033">
    <rect x="52" y="126" width="174" height="112" rx="8" fill="#ffffff" stroke="#98a5b3"/>
    <text x="78" y="158" font-weight="700">Paper evidence</text>
    <text x="78" y="184">limitations</text>
    <text x="78" y="206">negative results</text>
    <text x="78" y="228">failed replications</text>
    <path d="M228 182 H322" stroke="#4d6379" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="326" y="108" width="206" height="148" rx="8" fill="#ffffff" stroke="#98a5b3"/>
    <text x="354" y="140" font-weight="700">Signal clustering</text>
    <text x="354" y="168">topic</text>
    <text x="354" y="192">method</text>
    <text x="354" y="216">lab capability</text>
    <text x="354" y="240">interest match</text>
    <path d="M534 182 H626" stroke="#4d6379" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="630" y="126" width="150" height="112" rx="8" fill="#ffffff" stroke="#98a5b3"/>
    <text x="656" y="158" font-weight="700">Ranked gap</text>
    <text x="656" y="184">score</text>
    <text x="656" y="206">confidence</text>
    <text x="656" y="228">evidence digest</text>
    <path d="M782 182 H842" stroke="#4d6379" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="846" y="126" width="84" height="112" rx="8" fill="#ffffff" stroke="#98a5b3"/>
    <text x="864" y="166" font-weight="700">Assistant</text>
    <text x="864" y="194">review</text>
    <text x="864" y="218">citations</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4d6379"/>
    </marker>
  </defs>
</svg>
